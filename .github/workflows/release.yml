name: release

# Tag a commit `vX.Y.Z` to publish binaries for linux/macOS/windows and (optionally) the npm library.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Cross-compile
        env:
          PCB23D_VERSION: ${{ github.ref_name }}
        run: bun run --cwd apps/cli build:all
      - name: Checksums
        working-directory: apps/cli/dist
        run: sha256sum pcb23d-* > SHA256SUMS.txt
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/cli/dist/pcb23d-*
            apps/cli/dist/SHA256SUMS.txt

  npm:
    # Publishes the `pcb23d` library when an NPM_TOKEN secret is configured; skipped otherwise.
    runs-on: ubuntu-latest
    needs: binaries
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build:lib
      - name: Sync version from tag
        working-directory: packages/core
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" || true
      - run: npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
