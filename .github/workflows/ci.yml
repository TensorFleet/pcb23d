name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:lib
      - run: bun run --cwd apps/web build
      - name: Compile CLI for this runner
        run: bun run --cwd apps/cli build
      - name: Smoke-test the compiled binary
        run: |
          ./apps/cli/dist/pcb23d --version
          ./apps/cli/dist/pcb23d packages/core/test/fixtures/ecc83-pp.kicad_pcb --out /tmp/pcb23d-smoke --width 400 --height 300 --json
          ls -la /tmp/pcb23d-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  binaries:
    # Cross-compiled binaries for every push to main and every PR, kept a week for testing.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build:all
      - uses: actions/upload-artifact@v4
        with:
          name: pcb23d-binaries
          path: apps/cli/dist/pcb23d-*
          retention-days: 7
